name: Build APK and Windows app

on:
  push:
    # diag: one-off checks; screens: desktop screenshots (desktop-screens.yml).
    branches-ignore: [diag, screens]
  workflow_dispatch:

permissions:
  contents: write # lets the job publish a release for the in-app updater

# One build per branch at a time: two main builds running side by side could publish out of
# order, and GitHub marks the last one published as "latest", so the app would be offered an
# older version. A newer push cancels the running build: only the newest commit gets built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # engine/ is a submodule pointing at the private Yu-Gi-Oh-Engine repo. The default token
      # can't read it, so it is fetched with the ENGINE_TOKEN secret (read access to that repo).
      - name: Fetch the engine submodule
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          if [ -z "$ENGINE_TOKEN" ]; then
            echo "::error::Add a repository secret ENGINE_TOKEN with read access to 0megaXP/Yu-Gi-Oh-Engine (see README)."
            exit 1
          fi
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The engine's C++ is compiled through ccache, kept between builds: when the engine
      # didn't change, its compile takes seconds instead of minutes.
      - name: Engine version
        run: echo "ENGINE_SHA=$(git rev-parse HEAD:engine)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.ENGINE_SHA }}
          restore-keys: ccache-android-

      - name: Install ccache
        run: sudo apt-get install -y -q --no-install-recommends ccache

      - uses: gradle/actions/setup-gradle@v4

      # Only arm64 (every phone the app runs on); the emulator ABI would be a second full compile.
      - name: Build
        env:
          YGOE_CCACHE: "1"
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pygoe.abis=arm64-v8a
          ccache -s | head -5 || true
          VERSION="0.0.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/YGOSandbox-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YGOSandbox-${{ env.VERSION }}
          path: app/build/outputs/apk/release/*.apk

      # Each build on main becomes a GitHub release; the app checks the latest one for updates.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # only a higher version than the current latest may become "latest"
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v0\.0\.//')
          MARK=true
          if [ -n "$LATEST" ] && [ "$LATEST" -gt "$GITHUB_RUN_NUMBER" ] 2>/dev/null; then MARK=false; fi
          gh release create "v$VERSION" app/build/outputs/apk/release/YGOSandbox-$VERSION.apk \
            --title "YGO Sandbox $VERSION" \
            --notes "${NOTES:-New build}" \
            --latest=$MARK

  # ---------------- Windows app ----------------

  # The engine for Windows, cross-compiled on Linux (MinGW-w64): ygoe_jni.dll + the card pack.
  # Kept in a cache per engine commit: rebuilt (and re-checked on Windows) only when the engine changes.
  engine-windows:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Engine version
        run: echo "ENGINE_SHA=$(git rev-parse HEAD:engine)" >> "$GITHUB_ENV"

      - id: cache
        uses: actions/cache@v4
        with:
          path: engine-windows/
          key: engine-windows-${{ env.ENGINE_SHA }}
          enableCrossOsArchive: true # also read on Windows (desktop-screens.yml)

      - name: Fetch the engine submodule
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build the engine for Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
          engine/tools/build_windows.sh "$PWD/engine-windows"

      # The DLL's debug symbols stay out of the app; they go to the symbols branch, per engine
      # version, to map crash dump addresses to source lines.
      - name: Keep the engine's debug symbols
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sym
          mv engine-windows/ygoe_jni.dll.debug sym/
          cp engine-windows/ygoe_jni.dll sym/
          xz -6 -T0 sym/ygoe_jni.dll.debug sym/ygoe_jni.dll
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 -b symbols "$REPO" symrepo 2>/dev/null || { mkdir symrepo; git -C symrepo init -q -b symbols; }
          mkdir -p "symrepo/engine-$ENGINE_SHA"
          cp sym/* "symrepo/engine-$ENGINE_SHA/"
          cd symrepo
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Symbols for engine $ENGINE_SHA"
          git push -q "$REPO" symbols

      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine-windows/

  # The Windows app: checks the engine DLL on real Windows, then packages the MSI installer.
  windows:
    needs: engine-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      YGO_DESKTOP_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine submodule
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: engine-windows

      - name: Put the engine in the app's resources
        run: |
          cp engine-windows/ygoe_jni.dll desktop/resources/windows/
          mkdir -p desktop/resources/common
          cp -r engine-windows/ygoe desktop/resources/common/ygoe

      # Load the DLL through Java on Windows and run an analysis, a cancel, a profile and a side plan.
      # Only for a newly built engine: a cached one was already checked when it was built.
      - name: Check the engine on Windows
        if: needs.engine-windows.outputs.fresh == 'true'
        run: |
          mkdir -p jni-classes
          javac -d jni-classes engine/tests/jni/com/ygoengine/*.java
          java -Djava.library.path=desktop/resources/windows -cp jni-classes com.ygoengine.JniSmoke \
            desktop/resources/common/ygoe engine/examples | grep -v '^progress'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the installer
        run: |
          ./gradlew :desktop:packageMsi --no-daemon
          VERSION="0.0.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          mv desktop/build/compose/binaries/main/msi/*.msi "out/YGOSandbox-$VERSION.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: YGOSandbox-windows
          path: out/*.msi

  # Adds the installer to the release the Android job published.
  release-windows:
    if: github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YGOSandbox-windows
          path: out

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v0.0.$GITHUB_RUN_NUMBER" out/*.msi --clobber --repo "${{ github.repository }}"

