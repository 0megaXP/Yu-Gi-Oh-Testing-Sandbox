name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the job publish a release for the in-app updater

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # engine/ is a submodule pointing at the private Yu-Gi-Oh-Engine repo. The default token
      # can't read it, so it is fetched with the ENGINE_TOKEN secret (read access to that repo).
      - name: Fetch the engine submodule
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          if [ -z "$ENGINE_TOKEN" ]; then
            echo "::error::Add a repository secret ENGINE_TOKEN with read access to 0megaXP/Yu-Gi-Oh-Engine (see README)."
            exit 1
          fi
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="0.0.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/YGOSandbox-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YGOSandbox-${{ env.VERSION }}
          path: app/build/outputs/apk/release/*.apk

      # Each build on main becomes a GitHub release; the app checks the latest one for updates.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/YGOSandbox-$VERSION.apk \
            --title "YGO Sandbox $VERSION" \
            --notes "${NOTES:-New build}"
