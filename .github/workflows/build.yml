name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # lets the job publish a release for the in-app updater

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="0.0.$GITHUB_RUN_NUMBER"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/YGOSandbox-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YGOSandbox-${{ env.VERSION }}
          path: app/build/outputs/apk/release/*.apk

      # Each build on main becomes a GitHub release; the app checks the latest one for updates.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/YGOSandbox-$VERSION.apk \
            --title "YGO Sandbox $VERSION" \
            --notes "${NOTES:-New build}"
