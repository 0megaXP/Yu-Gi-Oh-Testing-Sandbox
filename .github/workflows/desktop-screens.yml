name: Desktop screenshots

# Runs the desktop app on Linux under a virtual screen, walks through the main screens at two
# window sizes and keeps a screenshot of each, to check the layout on a desktop window.
on:
  push:
    branches: [screens]
  workflow_dispatch:

permissions:
  contents: write # pushes the screenshots to the screens-out branch

jobs:
  screens:
    runs-on: ubuntu-latest
    env:
      YGO_DESKTOP_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine submodule
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the engine for Linux
        run: |
          cd engine
          tools/bootstrap.sh
          python3 tools/make_pack.py third_party/CardScripts data ../desktop/resources/common/ygoe
          # Own copy of the C++ runtime, hidden: the UI's native library also carries one, and mixing
          # the two in one process crashed on the first number written to a string stream.
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DYGOE_BUILD_JNI=ON -DYGOE_BUILD_CLI=OFF \
            "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"
          cmake --build build-linux -j"$(nproc)" --target ygoe_jni
          mkdir -p ../desktop/resources/linux
          cp build-linux/libygoe_jni.so ../desktop/resources/linux/

      - uses: gradle/actions/setup-gradle@v4

      - name: Take the screenshots
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          export SKIKO_RENDER_API=SOFTWARE
          for size in 1100x880 1536x864; do
            YGO_TOUR="$PWD/screens/$size" YGO_TOUR_SIZE=$size YGO_TOUR_DECKS="$PWD/engine/decks" \
              timeout 1200 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :desktop:run --no-daemon || true
          done
          # Crash reports, if the app crashed.
          cp desktop/hs_err*.log screens/ 2>/dev/null || true
          ls -R screens

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/

      # Also as a branch, so the pictures can be looked at without downloading the artifact.
      - name: Push the screenshots to screens-out
        run: |
          cd screens
          git init -q -b screens-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens-out

  # The engine DLL for Windows (cached per engine commit, shared with the main build).
  engine-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine version
        run: echo "ENGINE_SHA=$(git rev-parse HEAD:engine)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@v4
        with:
          path: engine-windows/
          key: engine-windows-${{ env.ENGINE_SHA }}
          enableCrossOsArchive: true
      - name: Build the engine for Windows
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
          engine/tools/build_windows.sh "$PWD/engine-windows"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine-windows/

  # The same tour on real Windows (the app as users run it), with a longer duel.
  windows:
    needs: engine-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      YGO_DESKTOP_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine submodule
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth 1 engine

      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: engine-windows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Take the screenshots
        run: |
          cp engine-windows/ygoe_jni.dll desktop/resources/windows/
          mkdir -p desktop/resources/common
          cp -r engine-windows/ygoe desktop/resources/common/ygoe
          YGO_TOUR="$PWD/screens/windows" YGO_TOUR_SIZE=1100x880 YGO_TOUR_DECKS="$PWD/engine/decks" YGO_TOUR_DUEL_SHOTS=12 \
            timeout 1800 ./gradlew :desktop:run --no-daemon || echo "app exit code $?"
          for f in desktop/hs_err*.log; do [ -f "$f" ] && { cp "$f" screens/; head -60 "$f"; }; done
          ls -R screens

      - name: Push the screenshots to screens-out-windows
        run: |
          cd screens
          git init -q -b screens-out-windows
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Windows screenshots of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens-out-windows
